plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.4'
    mappings 'net.fabricmc:yarn:1.20.4+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.15.3'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.0+1.20.4'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include 'fabric.mod.json'
        expand ['version': project.version, 'minecraft_version': project.minecraft.version]
    }
    into 'build/resources/main'
}
